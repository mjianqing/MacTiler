name: MacTiler
options:
  developmentLanguage: en
  bundleIdPrefix: com.junmaly
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: G2B4QZWQN7
    # Prefer stable Team Development over ad-hoc so TCC DR binds Team+identifier (not cdhash).
    # No Developer ID Application cert on this Mac yet — Development is the stable local choice.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.12"
    CURRENT_PROJECT_VERSION: "13"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  MacTiler:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacTiler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junmaly.mactiler
        PRODUCT_NAME: MacTiler
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Resources/MacTiler.entitlements
        # Keep Hardened Runtime off for local Development builds (AX friendliness).
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        DEVELOPMENT_TEAM: G2B4QZWQN7
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
schemes:
  MacTiler:
    build:
      targets:
        MacTiler: all
    run:
      config: Debug
